name: Arduino compile

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Install DHT sensor library
        run: arduino-cli lib install "DHT sensor library"

      - name: Install Adafruit Unified Sensor dependency
        run: arduino-cli lib install "Adafruit Unified Sensor"

      - name: Compile for generic ESP8266 module
        run: arduino-cli compile --fqbn esp8266:esp8266:generic .
